<app-usernav></app-usernav>
<h2>My Feedback</h2>
  
    <table *ngIf="userFeedbacks.length > 0">
      <thead>
        <tr>
          <th>#</th>
          <th>Feedback Message</th>
          <th>Date</th>
          <th>Category</th>
          <th>Investment</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let feedback of userFeedbacks | paginate: { itemsPerPage: 5, currentPage: page }; let i = index">
          <td>{{ i + 1 }}</td>
          <td>{{feedback.feedbackText}}</td>
          <td>{{feedback.date | date : 'mediumDate'}}</td>
          <td>{{feedback.category}}</td>
          <td>{{feedback.investment.name}}</td>
         <td> <button (click)="deleteFeedback(feedback.feedbackId)">Delete</button></td>
        </tr>
      </tbody>
    </table>
  
<div class="error-message" *ngIf="showConfirmation">
  <p>Are you sure you want to delete this feedback?</p>
  <button (click)="confirmDelete()">Yes</button>
  <button (click)="cancelDelete()">No</button>
</div>

    <div *ngIf="userFeedbacks.length === 0">
      <p>No feedback submitted yet.</p>
    </div>

    <div *ngIf="userFeedbacks.length > 0" style="margin-top: 20px; text-align: center;">
      <pagination-controls
        (pageChange)="page = $event"
        previousLabel="« Prev"
        nextLabel="Next »"
        [maxSize]="5"
        [directionLinks]="true"
        [autoHide]="false">
      </pagination-controls>
    </div>
